<div class="zelf-card apps-hub" *transloco="let t">
    <div class="apps-hub__header">
        <div class="apps-hub__header-col1">
            <button type="button" (click)="goBack()" class="zelf-icon-button zelf-icon-button--secondary zelf-icon-button--40" mat-flat-button>
                <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20.0898 5.8277H4.72478L8.08478 2.4677C8.53978 2.0127 8.53978 1.2777 8.08478 0.822695C7.62978 0.367695 6.89478 0.367695 6.43978 0.822695L1.08478 6.1777C0.62978 6.6327 0.62978 7.3677 1.08478 7.8227L6.43978 13.1777C6.89478 13.6327 7.62978 13.6327 8.08478 13.1777C8.53978 12.7227 8.53978 11.9877 8.08478 11.5327L4.72478 8.16103H20.0898C20.7314 8.16103 21.2564 7.63603 21.2564 6.99436C21.2564 6.3527 20.7314 5.8277 20.0898 5.8277Z"
                    />
                </svg>
            </button>
        </div>
        <div class="apps-hub__header-col2">
            <p class="apps-hub__title">{{ t("common.apps") }}</p>
        </div>
        <div class="apps-hub__header-col3"></div>
    </div>

    <div class="apps-hub__body">
        <div class="apps-hub__list">
            <button
                type="button"
                *ngFor="let dest of hubDestinations"
                class="apps-hub__row"
                [class.apps-hub__row--active]="rowIsActive(dest)"
                (click)="navigateTo(dest)"
            >
                <div class="apps-hub__icon-tile">
                    <img [src]="dest.iconUrl" alt="" class="apps-hub__icon-img" />
                </div>
                <span class="apps-hub__label">{{ t(navService.hubLabelKey(dest)) }}</span>
                <div class="apps-hub__chevron" aria-hidden="true">
                    <svg width="8" height="12" viewBox="0 0 8 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1.70504 0L0.295044 1.41L4.87504 6L0.295044 10.59L1.70504 12L7.70504 6L1.70504 0Z" />
                    </svg>
                </div>
            </button>
        </div>

        <div class="apps-hub__footer-strip">
            <div class="apps-hub__footer-row">
                <!-- Language picker (Figma full menu: globe + chevron next to Settings) -->
                <button
                    type="button"
                    class="apps-hub__row apps-hub__lang-btn"
                    [matMenuTriggerFor]="languageMenu"
                    [attr.aria-label]="t('settings.language_label')"
                    [title]="getLanguageName(activeLang)"
                >
                    <svg class="apps-hub__lang-globe" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5" />
                        <path d="M2.75 12H21.25" stroke="currentColor" stroke-width="1.5" />
                        <path d="M12 2.75C14.4 5.3 15.6 8.4 15.6 12C15.6 15.6 14.4 18.7 12 21.25C9.6 18.7 8.4 15.6 8.4 12C8.4 8.4 9.6 5.3 12 2.75Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                    </svg>
                    <svg class="apps-hub__lang-chevron" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M1 6.5L6 1.5L11 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>

                <a
                    class="apps-hub__row apps-hub__row--link"
                    routerLink="/settings"
                    routerLinkActive="apps-hub__row--active"
                    [routerLinkActiveOptions]="{ exact: false }"
                >
                    <div class="apps-hub__icon-tile">
                        <img src="assets/icons/settings_icon.svg" alt="" class="apps-hub__icon-img" />
                    </div>
                    <span class="apps-hub__label">{{ t("common.settings") }}</span>
                    <div class="apps-hub__chevron" aria-hidden="true">
                        <svg width="8" height="12" viewBox="0 0 8 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1.70504 0L0.295044 1.41L4.87504 6L0.295044 10.59L1.70504 12L7.70504 6L1.70504 0Z" />
                        </svg>
                    </div>
                </a>
            </div>

            <mat-menu #languageMenu="matMenu" class="zelf-menu" yPosition="above">
                <button type="button" mat-menu-item *ngFor="let lang of availableLangs" (click)="setLanguage(lang.id)">
                    <span class="apps-hub__lang-option" [class.apps-hub__lang-option--active]="lang.id === activeLang">
                        <img class="apps-hub__lang-flag" [src]="'assets/images/flags/' + flagCodes[lang.id]?.toUpperCase() + '.svg'" alt="" />
                        <span>{{ getLanguageName(lang.id) }}</span>
                    </span>
                </button>
            </mat-menu>
        </div>

        <div class="apps-hub__version">
            <span class="apps-hub__version-text">v{{ appVersion }}</span>
            <span class="apps-hub__version-dot" *ngIf="buildDate">•</span>
            <span class="apps-hub__version-date" *ngIf="buildDate">{{ buildDate }}</span>
        </div>
    </div>
</div>
