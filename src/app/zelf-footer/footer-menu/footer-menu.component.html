<div class="footer-menu-pill" *transloco="let t">
    <ng-container *ngIf="navService.activeDestination$ | async as activeDest">
        <!-- Active Segment -->
        <div class="footer-menu-pill__active" [routerLink]="[activeDest.route]">
            <img [src]="activeDest.iconUrl" alt="" class="footer-menu-pill__active-icon" />
            <span class="footer-menu-pill__active-text">{{ t(activeDest.labelKey) }}</span>
        </div>
    </ng-container>

    <!-- Grid Icon -->
    <button class="footer-menu-pill__icon-btn" (click)="openAppsHub()" aria-label="Open apps">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="6" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="4" width="6" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
            <rect x="4" y="14" width="6" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="14" width="6" height="6" rx="2" stroke="currentColor" stroke-width="2"/>
        </svg>
    </button>

    <!-- Hub Refresh Icon (2FA & Passwords hub screens, matching Android AppHubBottomBar) -->
    <button
        *ngIf="!(isDeepShell$ | async) && showHubRefresh"
        type="button"
        class="footer-menu-pill__icon-btn"
        (click)="onHubRefresh()"
        [attr.aria-label]="t('zotp.refresh')"
        [title]="t('zotp.refresh')"
    >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
                d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4.01 7.58 4.01 12C4.01 16.42 7.58 20 12 20C15.73 20 18.84 17.45 19.73 14H17.65C16.83 16.33 14.61 18 12 18C8.69 18 6 15.31 6 12C6 8.69 8.69 6 12 6C13.66 6 15.14 6.69 16.22 7.78L13 11H20V4L17.65 6.35Z"
                fill="currentColor"
            />
        </svg>
    </button>

    <!-- Deep screens: + Add. Hub screens no longer show the zAI star (#29: zAI retired). -->
    <ng-container *ngIf="isDeepShell$ | async">
        <button
            type="button"
            class="footer-menu-pill__add"
            (click)="onDeepAdd()"
            [attr.aria-label]="t('common.add')"
        >
            <span class="footer-menu-pill__add-icon" aria-hidden="true">+</span>
            <span class="footer-menu-pill__add-label">{{ t("common.add") }}</span>
        </button>
    </ng-container>
</div>
