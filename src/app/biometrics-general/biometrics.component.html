<div
    fxLayout="column"
    fxLayoutAlign="center center"
    class="biometric-shell min-h-[60vh] justify-center p-4 sm:p-1 xs:p-1 w-full"
    [class.biometric-shell--portrait]="displayMode === 'portrait'"
>
    <div
        *ngIf="!camera.isLoading && camera.hasPermissions && !camera.isLowQuality"
        class="justify-center w-full"
        fxLayout="column"
        fxLayoutAlign="center center"
    >
        <div class="relative" [style.width.px]="camera.dimensions.video.width" [style.height.px]="camera.dimensions.video.height">
            <webcam
                (imageCapture)="processImage($event)"
                (initError)="cameraError($event)"
                [allowCameraSwitch]="false"
                [captureImageData]="true"
                [height]="camera.dimensions.video.max.height"
                [imageQuality]="1"
                [trigger]="takePicture$"
                [videoOptions]="camera.configuration"
                [width]="camera.dimensions.video.max.width"
                *ngIf="!response.base64Image"
                #webcam
                mirrorImage="always"
            ></webcam>

            <canvas
                [style.height.px]="response.base64Image ? camera.dimensions.result?.height : camera.dimensions.video.height"
                [style.width.px]="response.base64Image ? camera.dimensions.result?.width : camera.dimensions.video.width"
                #maskResult
                class="absolute top-0 left-0"
            ></canvas>

            <div
                *ngIf="errorFace && !response.isLoading"
                class="biometric__status"
                role="status"
                aria-live="polite"
            >
                <span class="material-symbols-outlined biometric__status-icon" aria-hidden="true">{{ errorFace.icon || "face" }}</span>
                <div class="biometric__status-content">
                    <span class="biometric__status-title">{{ errorFace.title }}</span>
                    <span class="biometric__status-subtitle">{{ errorFace.subtitle }}</span>
                </div>
            </div>

            <div
                *ngIf="signalReport?.virtualCamera && !response.isLoading"
                class="biometric__vcam-warning"
                role="status"
                aria-live="polite"
            >
                <span class="material-symbols-outlined biometric__vcam-warning-icon" aria-hidden="true">videocam_off</span>
                <div class="biometric__vcam-warning-body">
                    <span class="biometric__vcam-warning-text">{{ "liveness.virtual_camera_warning" | transloco }}</span>
                    <div *ngIf="videoInputs.length > 1" class="biometric__vcam-warning-select-row">
                        <label for="biometric-camera-select" class="biometric__vcam-warning-label">
                            {{ "liveness.select_camera" | transloco }}
                        </label>
                        <select
                            id="biometric-camera-select"
                            class="biometric__vcam-warning-select"
                            [value]="selectedDeviceId"
                            (change)="onCameraChange($any($event.target).value)"
                        >
                            <option *ngFor="let cam of videoInputs" [value]="cam.deviceId">
                                {{ cam.label }}
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <canvas #toSend hidden="true"></canvas>

            <div
                *ngIf="displayMode === 'portrait' && ovalGuide"
                class="biometric__oval"
                [style.left.%]="ovalGuide.left"
                [style.top.%]="ovalGuide.top"
                [style.width.%]="ovalGuide.width"
                [style.height.%]="ovalGuide.height"
                aria-hidden="true"
            ></div>
        </div>
    </div>

    <div class="loader" fxLayout="column" fxLayoutAlign="center center" *ngIf="response.base64Image || camera.isLoading">
        <zelf-loader [diameter]="120"></zelf-loader>
    </div>

    <div fxLayout="column" fxLayoutAlign="center center" class="id-scanning-error-div" *ngIf="!camera.isLoading && camera.isLowQuality">
        <img src="https://cdn.verifik.co/demo/nocameraenabled.svg" alt="" class="id-scanning-no-camera-enabled-img" />

        <h1 class="mt-4">{{ "id_scanning.camera_not_found" | transloco }}</h1>

        <p class="mt-4">
            {{ "id_scanning.camera_not_found_description" | transloco }}
        </p>
    </div>
</div>
