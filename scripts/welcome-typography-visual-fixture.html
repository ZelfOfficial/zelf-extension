<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subtitle readability comparison</title>
  <style>
    body { font-family: Poppins, sans-serif; margin: 24px; background: #1a1d2e; color: #f5f5f5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1100px; }
    .card { background: #f7f6f4; color: #181818; border-radius: 48px; padding: 32px; min-height: 200px; }
    h2 { margin: 0 0 8px; font-size: 26px; text-transform: uppercase; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 16px; }
    .wrap { overflow: hidden; }
    .frame { width: 402px; transform-origin: top center; margin: 0 auto; }
    .subtitle { font-size: 14px; font-weight: 500; color: #5c5c5c; text-align: center; line-height: 20px; }
  </style>
</head>
<body>
  <h1>Unlock screen subtitle — 1366×768 fullscreen</h1>
  <div class="grid">
    <div>
      <div class="label">Before (2.1.51) ~11.0px effective</div>
      <div class="wrap">
        <div class="frame" style="transform: scale(0.9);">
          <div class="card" style="font-size: calc(14px * 0.87);">
            <h2>Password</h2>
            <p class="subtitle" style="font-size: calc(14px * 0.87);">Enter your password to unlock your wallet and access your assets.</p>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="label">After (this PR) ~13.3px effective</div>
      <div class="wrap">
        <div class="frame" style="transform: scale(0.95);">
          <div class="card">
            <h2>Password</h2>
            <p class="subtitle">Enter your password to unlock your wallet and access your assets.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
